[project]
name = "codetrust"
version = "0.1.0"
description = "Benchmark measuring how secure and correct LLM-generated web-app code is, and how much it changes with prompt wording"
requires-python = ">=3.11"

[tool.setuptools]
packages = ["codetrust"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["extension", "data/tasks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -m 'not slow and not docker'"
markers = [
    "slow: runs every task's reference and vulnerable solutions (several minutes)",
    "docker: needs Docker and the codetrust-sandbox image or the Semgrep image",
]
